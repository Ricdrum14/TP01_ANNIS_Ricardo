<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <script src="index.js"> </script>
  <title>Inscription</title>
</head>
<body>
  <h1>Inscription</h1>

  <form action="#" method="post">
    <!-- Login -->
    <div>
      <label for="login">Login</label><br>
      <input type="text" class="login" id="login" name="login" required>
    </div>

    <!-- Mot de passe -->
    <div>
      <label for="password">Mot de passe</label><br>
      <input type="password" class="password" id="password" name="password" required>
    </div>

    <!-- Confirmation du mot de passe -->
    <div>
      <label for="confirm_password">Confirmation du mot de passe</label><br>
      <input type="password" class="confirm_password" id="confirm_password" name="confirm_password" required>
    </div>

    <!-- Nom -->
    <div>
      <label for="nom">Nom</label><br>
      <input type="text" class="nom" id="nom" name="nom" required>
    </div>

    <!-- Prénom -->
    <div>
      <label for="prenom">Prénom</label><br>
      <input type="text"  class="prenom" id="prenom" name="prenom" required>
    </div>

    <!-- Adresse -->
    <div>
      <label for="adresse">Adresse</label><br>
      <input type="text"  class="adresse" id="adresse" name="adresse" required>
    </div>

    <!-- Email -->
    <div>
      <label for="email">Email</label><br>
      <input type="email" class="email" id="email" name="email" required>
    </div>

    <!-- Téléphone (champ texte) -->
    <div>
      <label for="telephone">Téléphone</label><br>
      <input type="text"  class="telephone" id="telephone" name="telephone" required>
    </div>

    <!-- Date de naissance -->
    <div>
      <label for="date_naissance">Date de naissance</label><br>
      <input type="date" class="date_naissance" id="date_naissance" name="date_naissance" required>
    </div>

    <!-- Bouton S'inscrire -->
    <div>
      <button type="submit">S’inscrire</button>
    </div>
  </form>
</body>
</html>
